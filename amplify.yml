frontend:
  phases:
    preBuild:
      commands:
        - npm ci --cache .npm --prefer-offline --legacy-peer-deps
        # - AWS_REGION=ap-southeast-1 npx ampx generate outputs --branch development --app-id d2f3vb7uagtn49
    build:
      commands:
        - npm run build -- --configuration=production
  artifacts:
    baseDirectory: dist/frontend/browser/
    files:
      - '**/*'
  cache:
    paths:
      - '.npm/**/*'
      - '.nx/cache/**/*'
      - 'node_modules/**/*'
